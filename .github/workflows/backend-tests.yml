# Runs the backend tests on every pull request and push to main or wip.
# A failing test marks the PR red.
#   - pytest: unit + integration tests, with coverage
#   - e2e:    starts the API and runs the Postman collection with newman
name: Backend tests

on:
  pull_request:
    branches: [main, wip]
  push:
    branches: [main, wip]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # settings (test folder, coverage options) come from backend/pyproject.toml
      - name: Run tests
        run: python -m pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: backend/htmlcov/

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # fastapi[standard] adds the `fastapi run` command (server)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "fastapi[standard]==0.142.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install newman
        run: npm install -g newman

      # OQM.db isn't in the repo, so the server starts with a fresh db
      # (only the sample services)
      - name: Start API
        run: |
          fastapi run API/API.py --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/services > /dev/null && exit 0
            sleep 1
          done
          echo "API did not start"; cat server.log; exit 1

      - name: Run E2E tests
        working-directory: backend/backend_test
        run: newman run OQM_E2E.postman_collection.json --env-var baseUrl=http://localhost:8000

      - name: Server log
        if: failure()
        run: cat server.log